name: Desktop installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }} --workspace=@viaticocero/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/ViaticoCero-*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop' }}
          name: Escritorio ViáticoCero
          body: |
            Instaladores del escritorio. El expediente queda en el equipo (SQLite 3). No hay servidor.

            - Windows: `ViaticoCero-win-x64-setup.exe`
            - Linux: `ViaticoCero-linux-x64.AppImage` (`chmod +x` y ejecutar)
            - macOS Apple Silicon: `ViaticoCero-mac-arm64.dmg`
            - macOS Intel: `ViaticoCero-mac-x64.dmg`

            En Mac el build no está firmado: clic derecho → Abrir la primera vez.
          files: apps/desktop/release/ViaticoCero-*
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
